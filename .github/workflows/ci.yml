name: Validación

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Pruebas
        run: cargo test --locked
      - name: SBOM reproducible
        shell: pwsh
        run: .\scripts\generate-sbom.ps1 -Check
      - name: Release
        run: cargo build --locked --release

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias nativas de compilación
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Pruebas
        run: cargo test --locked
      - name: Release
        run: cargo build --locked --release
