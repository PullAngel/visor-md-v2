[package]
name = "visor-md"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

# Perfil de medicion del Sprint 0: las palancas de tamano de docs/budget.md
# aplicadas todas juntas, para que el binario medido sea el que se distribuye.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3.6.1", default-features = false }
atomicwrites = "0.4.4"
# Sin funciones por defecto a proposito. Las de comrak arrastran su CLI (clap,
# xdg, shell-words) y, peor, `syntect-onig`: resaltado de sintaxis apoyado en
# Oniguruma, una libreria de expresiones regulares escrita en C. Meter C al
# binario contradice de frente el ADR-2. Ver ADR-14.
comrak = { version = "0.54.0", default-features = false }
parley = "0.11.1"
rfd = "0.17.2"
ropey = "1.6.1"
softbuffer = "0.4.8"
swash = "0.2.10"
# El PNG solo se decodifica tras confirmación y los límites previos de
# `src/images.rs`; habilitar la feature no autoriza cargas automáticas.
tiny-skia = { version = "0.12.0", default-features = false, features = [
    "png-format",
    "std",
    "simd",
] }
winit = "0.30.13"
